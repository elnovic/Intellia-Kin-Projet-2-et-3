<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, Arial, sans-serif">
  <rect width="900" height="400" fill="#F8FAFC"/>
  <rect x="30" y="30" width="400" height="340" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="470" y="30" width="400" height="340" rx="14" fill="#FFFFFF" stroke="#00C9A7" stroke-width="2"/>
  <text x="60" y="75" font-family="Plus Jakarta Sans, Inter, Arial" font-size="22" font-weight="700" fill="#0A2540">Programme classique</text>
  <text x="500" y="75" font-family="Plus Jakarta Sans, Inter, Arial" font-size="22" font-weight="700" fill="#0A2540">Intelligence artificielle</text>
  <text x="60" y="105" font-size="15" fill="#4A5568">Un humain écrit toutes les règles</text>
  <text x="500" y="105" font-size="15" fill="#4A5568">La machine découvre les règles</text>
  <g font-family="JetBrains Mono, monospace" font-size="14" fill="#1A202C">
    <rect x="60" y="130" width="340" height="120" rx="8" fill="#F1F5F9"/>
    <text x="76" y="160">SI peau = jaune</text>
    <text x="76" y="185">ET mangue = souple</text>
    <text x="76" y="210">ALORS « mûre »</text>
    <text x="76" y="235" fill="#5B6B82">SINON …</text>
  </g>
  <g>
    <g fill="#00C9A7"><circle cx="520" cy="160" r="16"/><circle cx="560" cy="160" r="16"/><circle cx="600" cy="160" r="16"/></g>
    <g fill="#0066FF"><circle cx="520" cy="205" r="16"/><circle cx="560" cy="205" r="16"/><circle cx="600" cy="205" r="16"/></g>
    <text x="630" y="166" font-size="14" fill="#1A202C">exemples « mûre »</text>
    <text x="630" y="211" font-size="14" fill="#1A202C">exemples « pas mûre »</text>
    <path d="M520 240 v12 h150 v-12" stroke="#5B6B82" fill="none"/>
  </g>
  <text x="60" y="295" font-size="15" fill="#1A202C">Efficace si les règles sont simples.</text>
  <text x="60" y="320" font-size="15" fill="#1A202C">Impossible quand il y en a des milliers.</text>
  <text x="500" y="295" font-size="15" fill="#1A202C">Le modèle apprend seul ce qui distingue</text>
  <text x="500" y="320" font-size="15" fill="#1A202C">les deux, à partir de milliers d'exemples.</text>
</svg>
