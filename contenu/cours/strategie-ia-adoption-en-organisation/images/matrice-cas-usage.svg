<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 308" font-family="Inter, Arial, sans-serif">
<rect width="1000" height="308" fill="#F8FAFC"/>
<text x="30" y="45" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0A2540">Prioriser les cas d'usage</text>
<rect x="30" y="70" width="297" height="218" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="30" y="70" width="297" height="7" rx="3" fill="#0066FF"/>
<text x="50" y="112" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0A2540">À lancer d'abord</text>
<circle cx="56" cy="145" r="5" fill="#0066FF"/>
<text x="70" y="150" font-size="14.5" fill="#1A202C">Forte valeur</text>
<circle cx="56" cy="191" r="5" fill="#0066FF"/>
<text x="70" y="196" font-size="14.5" fill="#1A202C">Facile à mettre en œuvre</text>
<circle cx="56" cy="237" r="5" fill="#0066FF"/>
<text x="70" y="242" font-size="14.5" fill="#1A202C">Risque faible</text>
<rect x="352" y="70" width="297" height="218" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="352" y="70" width="297" height="7" rx="3" fill="#0A2540"/>
<text x="372" y="112" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0A2540">À préparer</text>
<circle cx="378" cy="145" r="5" fill="#0A2540"/>
<text x="392" y="150" font-size="14.5" fill="#1A202C">Forte valeur</text>
<circle cx="378" cy="191" r="5" fill="#0A2540"/>
<text x="392" y="196" font-size="14.5" fill="#1A202C">Plus complexe</text>
<circle cx="378" cy="237" r="5" fill="#0A2540"/>
<text x="392" y="242" font-size="14.5" fill="#1A202C">Demande des données ou un cadre</text>
<rect x="673" y="70" width="297" height="218" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="673" y="70" width="297" height="7" rx="3" fill="#00C9A7"/>
<text x="693" y="112" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0A2540">À écarter pour l'instant</text>
<circle cx="699" cy="145" r="5" fill="#00C9A7"/>
<text x="713" y="150" font-size="14.5" fill="#1A202C">Valeur faible</text>
<circle cx="699" cy="191" r="5" fill="#00C9A7"/>
<text x="713" y="196" font-size="14.5" fill="#1A202C">Ou risque trop élevé</text>
<circle cx="699" cy="237" r="5" fill="#00C9A7"/>
<text x="713" y="242" font-size="14.5" fill="#1A202C">Ou trop coûteux</text>
</svg>