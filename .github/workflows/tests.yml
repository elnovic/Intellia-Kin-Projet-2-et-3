name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Les cours (dossier contenu) sont vérifiés à chaque envoi.

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Lancer les tests
        run: pytest -q
      - name: Vérifier les cours du dépôt
        run: python -m app.cli check-courses
