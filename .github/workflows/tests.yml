name: Tests

on:
  push:
    branches: [main]
  pull_request:

# L'API et les cours (dossier contenu) sont vérifiés à chaque envoi.

permissions:
  contents: read

jobs:
  api:
    name: API et cours
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier les cours du dépôt
        run: node scripts/build-content.mjs --check
      - name: Lancer les tests
        run: node scripts/build-content.mjs && node --test --no-warnings test/*.test.mjs
